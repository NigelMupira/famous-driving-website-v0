 <style type="text/css">

 </style>   
 <style>

 </style>
    <title>Lesson Booking</title>
    <link rel="stylesheet"
type="text/css"
href="styles.css"
</head>
<body>
    <h1>Lesson Booking</h1>

    <div id="calendar"></div>

    <div id="booking-form">
      <h2>Book a Lesson</h2>
      <form action="submit.php" method="post">
        <label for="name">Name: </label>
        <input type="text" placeholder="Enter your name here--" id="name" name="name" required>
        <label for="number">Phone Number: </label>
        <input type="tel" placeholder="Enter phone number" id="number" name="number" required>
        <label for="email">Email: </label>
        <input type="email" placeholder="Enter your email address" id="email" name="email" required>
        <label for="address">Adress: </label>
        <input type="text" id="address" name="address" placeholder="Enter your permanent address" required>
        <label for="name">Class: </label>
        <input type="text" placeholder="Enter class of choice" id="name" name="name" required>
        <label for="date">Date: </label>
        <input type="date" id="date" name="date" required>
        <label for="appt">Select a Time:</label>
        <input type="time" id="appt" name="appt" required>
        <input type="submit" value="SUBMIT">
      </form>

    </div>

</body>
</html>
